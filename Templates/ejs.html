<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ game_name }}</title>
    <script src="{{ base_url }}/jellyemu/assets/jellyemu.utils.js?v={{ version }}"></script>
    <script src="{{ base_url }}/jellyemu/assets/coi-serviceworker.js"></script>
    <script src="{{ base_url }}/jellyemu/threejs/three.min.js"></script>
    <link rel="stylesheet" href="{{ base_url }}/jellyemu/assets/dist/jellyemu.index.bundle.css?v={{ version }}">
    <link rel="stylesheet" href="{{ base_url }}/jellyemu/assets/ejs.style.css">
    <script>
        window.__JELLYEMU_PLAYER_DATA__ = {
            itemId: "{{ item_id }}",
            userId: "{{ user_id }}",
            gameName: "{{ game_name }}",
            systemName: "{{ platform_tag }}",
            platformTag: "{{ platform_tag }}",
            core: "{{ core }}",
            romUrl: "{{ rom_url }}",
            saveGetUrl: "{{ save_get_url }}",
            savePostUrl: "{{ save_post_url }}",
            activeSlot: {{ active_slot }},
            isM3u: {{ is_m3u }},
            hasNetplay: {{ has_netplay }},
            netplayServer: "{{ netplay_server }}",
            netplayIceServers: {{ netplay_ice_servers_json }},
            gameId: {{ game_id }},
            activeShader: "{{ active_shader }}",
            videoRotation: {{ video_rotation }},
            vsync: "{{ vsync }}",
            ffrate: "{{ ffrate }}",
            smrate: "{{ smrate }}",
            showFps: "{{ show_fps }}",
            scale: "{{ scale }}",
            volume: "{{ volume }}",
            mute: "{{ mute }}",
            availableCores: {{ available_cores_json }},
            version: "{{ version }}"
        };
    </script>
    <script type="module" src="{{ base_url }}/jellyemu/assets/dist/jellyemu.player.bundle.js?v={{ version }}"></script>
</head>

<body>
    <!-- React HUD Mount Point -->
    <div id="jellyemu-player-root"></div>
    <!-- Loading Screen -->
    <div id="je-loader">
        <div class="je-loader-anim">
            <div class="je-pulse-ring"></div>
            <div class="je-pulse-ring"></div>
            <div class="je-pulse-ring"></div>
            <div class="je-spinner"></div>
        </div>
        <div id="je-loader-title">{{ game_name }}</div>
        <div id="je-loader-system"></div>
        <div id="je-loader-status">Loading ROM…</div>
        <button id="je-loader-log-toggle">
            <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor;"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            Show Log
        </button>
        <div id="je-loader-log-container"></div>
    </div>




    <div id="je-fps"></div>
    <div id="game"></div>
    <script id="je-available-cores-json" type="application/json">{{ available_cores_json }}</script>
    <script>
        (function () {
            var token = (window.JellyEmu && typeof window.JellyEmu.getAuthToken === 'function')
                ? window.JellyEmu.getAuthToken('{{ user_id }}')
                : '';
            window._jellyToken = token;

            window.JellyEmu = window.JellyEmu || {};
            window.JellyEmu.baseUrl = '{{ base_url }}';

            window.JellyEmuConfig = {
                baseUrl: '{{ base_url }}',
                itemId: '{{ item_id }}',
                userId: '{{ user_id }}',
                savePostUrl: '{{ save_post_url }}',
                activeSlot: {{ active_slot }},
                isM3u: {{ is_m3u }},
                token: token,
                hasNetplay: {{ has_netplay }},
                netplayServer: '{{ netplay_server }}',
                netplayIceServers: {{ netplay_ice_servers_json }},
                gameId: {{ game_id }},
                virtualGamepad: '{{ virtual_gamepad }}',
                virtualGamepadLefty: '{{ virtual_gamepad_lefty }}',
                platformTag: '{{ platform_tag }}',
                activeShader: '{{ active_shader }}',
                videoRotation: {{ video_rotation }},
                vsync: '{{ vsync }}',
                ffrate: '{{ ffrate }}',
                smrate: '{{ smrate }}',
                showFps: '{{ show_fps }}',
                scale: '{{ scale }}',
                volume: '{{ volume }}',
                mute: '{{ mute }}',
                inputScheme: {{ input_scheme_json }},
                customBindings: {{ custom_bindings_json }}
            };

            window.EJS_core = '{{ core }}';
            window.EJS_platformTag = '{{ platform_tag }}';
            var biosUrl = '{{ bios_url }}';
            if (biosUrl && biosUrl.trim().length > 0) {
                window.EJS_biosUrl = biosUrl.startsWith('http') ? biosUrl : (window.location.origin + biosUrl);
            } else {
                delete window.EJS_biosUrl;
            }
            try {
                var rawCoresJson = document.getElementById('je-available-cores-json').textContent || '[]';
                window.EJS_availableCores = JSON.parse(rawCoresJson);
            } catch (e) {
                console.error('[JellyEmu] Error parsing available cores JSON:', e);
                window.EJS_availableCores = [];
            }
        })();
    </script>
    <script>
        (function () {
            var _origGetContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function (type, attrs) {
                if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
                    attrs = Object.assign({
                        alpha: false,
                        desynchronized: true,
                        powerPreference: 'high-performance',
                        preserveDrawingBuffer: true
                    }, attrs || {});
                    attrs.alpha = false;
                    attrs.preserveDrawingBuffer = true;
                } else if (type === '2d') {
                    attrs = Object.assign({
                        alpha: false,
                        desynchronized: true,
                        willReadFrequently: false
                    }, attrs || {});
                    attrs.alpha = false;
                }
                return _origGetContext.call(this, type, attrs);
            };
        })();
    </script>
    <script>
        (function () {
            var _jellyToken = window._jellyToken || '';
            // Core name map for loading screen badge
            var coreNames = {
                nestopia: 'NES', fceumm: 'NES', snes9x: 'SNES', snes9x2010: 'SNES', snes9x2005: 'SNES',
                mupen64plus_next: 'N64', parallel_n64: 'N64',
                gambatte: 'Game Boy', sameboy: 'Game Boy', mgba: 'Game Boy Advance', vba_next: 'Game Boy Advance',
                desmume: 'Nintendo DS', melonds: 'Nintendo DS', azahar: 'Nintendo 3DS', beetle_vb: 'Virtual Boy',
                genesis_plus_gx: 'Sega Genesis', picodrive: 'Sega 32X', smsplus: 'Master System', yabause: 'Sega Saturn',
                pcsx_rearmed: 'PlayStation', mednafen_psx_hw: 'PlayStation', ppsspp: 'PSP', opera: '3DO',
                stella2014: 'Atari 2600', a5200: 'Atari 5200', prosystem: 'Atari 7800', handy: 'Atari Lynx',
                virtualjaguar: 'Atari Jaguar', mednafen_pce: 'TurboGrafx-16', mednafen_pcfx: 'PC-FX',
                mednafen_wswan: 'WonderSwan', mednafen_ngp: 'Neo Geo Pocket', gearcoleco: 'ColecoVision',
                vice_x64: 'Commodore 64', vice_x64sc: 'Commodore 64', vice_x128: 'Commodore 128',
                vice_xpet: 'Commodore PET', vice_xplus4: 'Commodore Plus/4', vice_xvic: 'Commodore VIC-20',
                puae: 'Commodore Amiga', fbneo: 'Arcade', mame2003: 'MAME', mame2003_plus: 'MAME',
                dosbox_pure: 'DOS', pico8: 'PICO-8'
            };
            var sysEl = document.getElementById('je-loader-system');
            if (sysEl) { var cn = coreNames[window.EJS_core] || window.EJS_core || ''; sysEl.textContent = cn; }

            // Loading screen lifecycle
            var loader = document.getElementById('je-loader');
            var topbar = document.getElementById('je-topbar');
            var dock = document.getElementById('je-dock');
            var isDown = false, startX, scrollLeft;

            function onStart(x) { if (!dock) return; isDown = true; startX = x - dock.offsetLeft; scrollLeft = dock.scrollLeft; dock.style.cursor = 'grabbing'; }
            function onEnd() { if (!dock) return; isDown = false; dock.style.cursor = 'grab'; }
            function onMove(x) { if (!isDown || !dock) return; dock.scrollLeft = scrollLeft - (x - dock.offsetLeft - startX); }

            if (dock) {
                dock.addEventListener('mousedown', function (e) { onStart(e.pageX); });
                dock.addEventListener('mouseleave', onEnd);
                dock.addEventListener('mouseup', onEnd);
                dock.addEventListener('mousemove', function (e) { e.preventDefault(); onMove(e.pageX); });

                dock.addEventListener('touchstart', function (e) { onStart(e.touches[0].pageX); }, { passive: true });
                dock.addEventListener('touchend', onEnd);
                dock.addEventListener('touchmove', function (e) { onMove(e.touches[0].pageX); }, { passive: true });
            }

            function dismissLoader() {
                if (!loader || loader.classList.contains('je-dismiss')) return;
                loader.classList.add('je-dismiss');
                setTimeout(function () { loader.style.display = 'none'; }, 450);
                if (topbar) topbar.classList.add('je-active');
                if (dock) dock.classList.add('je-active');
                startAutoHide();
            }
            // Fallback: auto-dismiss after 30s
            setTimeout(dismissLoader, 30000);

            window.EJS_onLoad = function (emulator) {
                if (emulator) {
                    window.EJS_emulator = emulator;
                    if (emulator.gameManager) window.gameManager = emulator.gameManager;
                }
                dismissLoader();
            };

            // Centralized EJS Game Start Callback Dispatcher
            window.EJS_onGameStart = function (emulator) {
                if (emulator) {
                    window.EJS_emulator = emulator;
                    if (emulator.gameManager) window.gameManager = emulator.gameManager;
                }
                console.log('[JellyEmu] EJS_onGameStart fired (Centralized Dispatcher)');
                var event = (typeof CustomEvent === 'function') ?
                    new CustomEvent('jellyemu:gamestart', { detail: { timestamp: Date.now(), emulator: emulator } }) :
                    document.createEvent('CustomEvent');
                if (typeof CustomEvent !== 'function') {
                    event.initCustomEvent('jellyemu:gamestart', true, true, { timestamp: Date.now(), emulator: emulator });
                }
                window.dispatchEvent(event);
            };

            // Subscribe UI dismissal and state loading to jellyemu:gamestart
            window.addEventListener('jellyemu:gamestart', function () {
                if (_jeEjsObserver) _jeEjsObserver.disconnect();
                if (typeof _jeFindLoader !== 'undefined') clearInterval(_jeFindLoader);
                dismissLoader();
                setTimeout(refocusGame, 500);

                 {{ if has_saves && slot_value > 0 }}
                setTimeout(function () {
                    var loadHeaders = {};
                    if (typeof _jellyToken !== 'undefined' && _jellyToken) {
                        loadHeaders['Authorization'] = 'MediaBrowser Token="' + _jellyToken + '"';
                    }
                    fetch((window.JellyEmuConfig.baseUrl || '') + '/jellyemu/save/{{ item_id }}/{{ user_id }}?slot={{ slot_value }}', { headers: loadHeaders })
                        .then(function (r) { if (r.ok) return r.arrayBuffer(); throw new Error('No save data'); })
                        .then(function (buf) {
                            var g = gm(); if (g) g.loadState(new Uint8Array(buf));
                            console.log('[JellyEmu] Pipeline STAGE 4 (Client Direct Receive): Downloaded bytes ->', buf.byteLength);
                        }).catch(function (e) { console.warn('[JellyEmu] Direct load failed:', e); });
                }, 500);
                {{ end }}

                setTimeout(function () {
                    var e = emu();
                    if (e) {
                        if (e.settingsMenu) e.settingsMenu.style.display = 'none';
                        if (e.controlMenu) e.controlMenu.style.display = 'none';
                    }
                }, 200);
            });

            // Loading Log & Error Interceptor
            var myStatusEl = document.getElementById('je-loader-status');
            var logContainer = document.getElementById('je-loader-log-container');
            var logToggle = document.getElementById('je-loader-log-toggle');
            var _jeLogHistory = [];
            var _lastLoggedText = '';

            function _jeLogLoadingStep(msg, isError) {
                if (!msg || msg === _lastLoggedText) return;
                _lastLoggedText = msg;
                var now = new Date();
                var timeStr = now.toTimeString().split(' ')[0];
                var line = '[' + timeStr + '] ' + msg;
                _jeLogHistory.push(line);
                if (logContainer) {
                    logContainer.textContent = _jeLogHistory.join('\n');
                    logContainer.scrollTop = logContainer.scrollHeight;
                    if (isError && loader && !loader.classList.contains('je-dismiss')) {
                        logContainer.style.display = 'block';
                        if (logToggle) {
                            logToggle.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor;"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg> Hide Log';
                        }
                    }
                }
            }

            if (logToggle && logContainer) {
                logToggle.addEventListener('click', function () {
                    var isHidden = logContainer.style.display === 'none' || !logContainer.style.display;
                    if (isHidden) {
                        logContainer.style.display = 'block';
                        logToggle.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor;"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg> Hide Log';
                        logContainer.scrollTop = logContainer.scrollHeight;
                    } else {
                        logContainer.style.display = 'none';
                        logToggle.innerHTML = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor;"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg> Show Log';
                    }
                });
            }

            // Intercept global JS errors, unhandled promise rejections, and console errors/warnings during loading
            window.addEventListener('error', function (evt) {
                var errStr = evt.message || (evt.error && evt.error.message) || 'Script loading error';
                if (evt.filename) {
                    var fileBasename = evt.filename.split('/').pop().split('?')[0];
                    errStr += ' (' + fileBasename + (evt.lineno ? ':' + evt.lineno : '') + ')';
                }
                _jeLogLoadingStep('[ERROR] ' + errStr, true);
            }, true);

            window.addEventListener('unhandledrejection', function (evt) {
                var reason = evt.reason ? (evt.reason.message || String(evt.reason)) : 'Unhandled rejection';
                _jeLogLoadingStep('[ERROR] Promise Rejection: ' + reason, true);
            });

            var origConsoleError = console.error;
            var origConsoleWarn = console.warn;

            console.error = function () {
                try {
                    var text = Array.prototype.slice.call(arguments).map(function (a) {
                        return (typeof a === 'object' && a !== null) ? (a.message || JSON.stringify(a)) : String(a);
                    }).join(' ');
                    if (text) _jeLogLoadingStep('[ERROR] ' + text, true);
                } catch (_) {}
                return origConsoleError.apply(console, arguments);
            };

            console.warn = function () {
                try {
                    var text = Array.prototype.slice.call(arguments).map(function (a) {
                        return (typeof a === 'object' && a !== null) ? (a.message || JSON.stringify(a)) : String(a);
                    }).join(' ');
                    if (text && text.indexOf('Translation not found') === -1) {
                        _jeLogLoadingStep('[WARN] ' + text, false);
                    }
                } catch (_) {}
                return origConsoleWarn.apply(console, arguments);
            };

            // Log initial boot milestones
            _jeLogLoadingStep('Initializing JellyEmu launcher...');
            _jeLogLoadingStep('Game: {{ game_name }}');
            if (window.EJS_core) _jeLogLoadingStep('Target Core: ' + window.EJS_core);
            if (window.EJS_gameUrl) _jeLogLoadingStep('ROM payload stream ready');

            var _jeEjsObserver = null;
            var _jeFindLoader = setInterval(function () {
                var ejsTextEl = document.querySelector('.ejs_loading_text');
                if (ejsTextEl) {
                    clearInterval(_jeFindLoader);

                    _jeEjsObserver = new MutationObserver(function () {
                        var text = ejsTextEl.textContent || ejsTextEl.innerText;
                        if (text && text.trim() !== '') {
                            var trimmed = text.trim();
                            myStatusEl.textContent = trimmed;
                            _jeLogLoadingStep(trimmed);
                        }
                    });

                    _jeEjsObserver.observe(ejsTextEl, {
                        childList: true,
                        characterData: true,
                        subtree: true
                    });
                }
            }, 200);

            // Auto-hide docks
            var hideTimer = null;
            var HIDE_MS = 3000;
            window._jePopupOpen = false;

            function showDocks() {
                if (!topbar || !topbar.classList.contains('je-active')) return;
                topbar.classList.remove('je-hidden');
                if (dock) dock.classList.remove('je-hidden');
                clearTimeout(hideTimer);
                if (!window._jePopupOpen) {
                    hideTimer = setTimeout(function () {
                        if (topbar) topbar.classList.add('je-hidden');
                        if (dock) dock.classList.add('je-hidden');
                    }, HIDE_MS);
                }
            }
            function startAutoHide() {
                ['mousemove', 'mousedown', 'touchstart', 'touchmove'].forEach(function (evt) {
                    document.addEventListener(evt, showDocks, { passive: true });
                });
                [topbar, dock].forEach(function (el) {
                    if (!el) return;
                    el.addEventListener('mouseenter', function () {
                        clearTimeout(hideTimer);
                        if (!dockMinimized) {
                            if (topbar) topbar.classList.remove('je-hidden');
                            if (dock) dock.classList.remove('je-hidden');
                        }
                    });
                    el.addEventListener('mouseleave', showDocks);
                });
                showDocks();
            }

            // Refocus game on any click on the game area or after dock button press
            var gameEl = document.getElementById('game');
            if (gameEl) {
                gameEl.addEventListener('mousedown', function () {
                    if (window._jePopupOpen) return;
                    setTimeout(refocusGame, 50);
                });
            }
            // Dock buttons: refocus game after each click (unless a popup opened)
            document.addEventListener('click', function (ev) {
                var btn = ev.target.closest && ev.target.closest('.je-dockbtn');
                if (btn && !window._jePopupOpen) { setTimeout(refocusGame, 50); }
            }, true);

            // Popup management
            function _jeDispatchPopupEvent(name, id) {
                var event = (typeof CustomEvent === 'function') ?
                    new CustomEvent(name, { detail: { id: id } }) :
                    document.createEvent('CustomEvent');
                if (typeof CustomEvent !== 'function') {
                    event.initCustomEvent(name, true, true, { id: id });
                }
                window.dispatchEvent(event);
                var callbackName = 'on' + name.charAt(0).toUpperCase() + name.slice(1);
                if (typeof window[callbackName] === 'function') {
                    window[callbackName](id);
                }
            }

            function openPopup(id) {
                closeAllPopups();
                var el = document.getElementById(id);
                if (el) {
                    el.classList.add('je-open');
                    window._jePopupOpen = true;
                    clearTimeout(hideTimer);
                    _jeDispatchPopupEvent('jePopupOpened', id);
                }
            }
            function closePopup(id) {
                var el = document.getElementById(id);
                if (el && el.classList.contains('je-open')) {
                    el.classList.remove('je-open');
                    window._jePopupOpen = false;
                    showDocks();
                    refocusGame();
                    _jeDispatchPopupEvent('jePopupClosed', id);
                }
            }
            function closeAllPopups() {
                var openPopups = document.querySelectorAll('.je-overlay.je-open');
                openPopups.forEach(function (el) {
                    var id = el.id;
                    el.classList.remove('je-open');
                    _jeDispatchPopupEvent('jePopupClosed', id);
                });
                window._jePopupOpen = false;
                refocusGame();
            }
            window._jeOpenPopup = openPopup;
            window._jeClosePopup = closePopup;
            // Close buttons
            document.querySelectorAll('[data-close]').forEach(function (btn) {
                btn.addEventListener('click', function () { closePopup(btn.getAttribute('data-close')); });
            });
            // Click outside popup to close
            document.querySelectorAll('.je-overlay').forEach(function (ov) {
                ov.addEventListener('click', function (e) { if (e.target === ov) { closeAllPopups(); showDocks(); refocusGame(); }});
            });

            // Tab switching
            document.querySelectorAll('.je-tab').forEach(function (tab) {
                tab.addEventListener('click', function () {
                    var tabs = tab.parentElement ? tab.parentElement.querySelectorAll('.je-tab') : [];
                    tabs.forEach(function (t) { t.classList.remove('je-tab-active'); });
                    tab.classList.add('je-tab-active');
                    var popup = tab.closest('.je-popup') || tab.closest('.je-overlay');
                    if (popup) {
                        var panels = popup.querySelectorAll('.je-tab-panel');
                        panels.forEach(function (p) { 
                            p.classList.remove('je-tab-active'); 
                            p.style.display = 'none';
                        });
                    }
                    var tabKey = tab.getAttribute('data-tab');
                    var target = document.getElementById('je-tab-' + tabKey) ||
                                 document.getElementById('je-panel-' + tabKey + '-settings');
                    if (target) {
                        target.classList.add('je-tab-active');
                        target.style.display = 'flex';
                        target.style.flexDirection = 'column';
                        target.style.width = '100%';
                    }
                });
            });

            // Helper: get emulator
            function emu() { return window.EJS_emulator; }
            function gm() { var e = emu(); return e ? e.gameManager : null; }

            function _jeEnsureBinary(data) {
                if (!data) return null;
                if (data instanceof Blob) return data;
                if (data instanceof Uint8Array) return new Blob([data], { type: 'application/octet-stream' });
                if (data instanceof ArrayBuffer) return new Blob([new Uint8Array(data)], { type: 'application/octet-stream' });
                if (typeof data === 'string') {
                    try {
                        var binary = window.atob(data);
                        var bytes = new Uint8Array(binary.length);
                        for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                        return new Blob([bytes], { type: 'application/octet-stream' });
                    } catch (ex) { return new Blob([new TextEncoder().encode(data)], { type: 'application/octet-stream' }); }
                }
                return new Blob([new TextEncoder().encode(JSON.stringify(data))], { type: 'application/octet-stream' });
            }
            window._jeEnsureBinary = _jeEnsureBinary;

            // Focus management: EJS listens for keyboard on ejs_parent, not document
            function refocusGame() {
                try { window.focus(); } catch (e) {}
                var e = emu();
                if (e && e.elements && e.elements.parent) {
                    e.elements.parent.focus();
                } else {
                    var gp = document.querySelector('.ejs_parent');
                    if (gp) gp.focus();
                }
            }
            window.addEventListener('click', function (e) {
                if (window._jePopupOpen) return;
                if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) return;
                try { window.focus(); } catch (e) {}
            });

            // Prevent keystrokes in any input fields from bubbling to Emscripten/game engine
            document.addEventListener('keydown', function (e) {
                if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) {
                    e.stopPropagation();
                }
            }, false);
            document.addEventListener('keyup', function (e) {
                if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) {
                    e.stopPropagation();
                }
            }, false);

            // Server sync for controls & settings
            var _syncTimer = null;
            function syncControlsToServer() {
                clearTimeout(_syncTimer);
                _syncTimer = setTimeout(function () {
                    var e = emu();
                    var c = e && e.controls && e.controls[0] ? e.controls[0] : {};
                    var kb = {}, gp = {};
                    for (var k in c) {
                        if (c[k].value !== undefined) {
                            if (!kb[k]) kb[k] = {};
                            kb[k].value = c[k].value;
                        }
                        if (c[k].value2 !== undefined) {
                            if (!gp[k]) gp[k] = {};
                            gp[k].value2 = c[k].value2;
                        }
                    }
                    var prefs = {
                        controls: JSON.stringify(kb),
                        controllerControls: JSON.stringify(gp)
                    };

                    var headers = { 'Content-Type': 'application/json' };
                    if (typeof _jellyToken !== 'undefined' && _jellyToken) {
                        headers['Authorization'] = 'MediaBrowser Token="' + _jellyToken + '"';
                    }

                    fetch((window.JellyEmuConfig.baseUrl || '') + '/jellyemu/prefs/{{ user_id }}', {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify({
                            scope: 'system',
                            targetId: '{{ platform_tag }}',
                            preferences: prefs
                        })
                    }).catch(function (err) { console.warn('[JellyEmu] Settings sync failed:', err); });
                }, 800);
            }

            // Exit button
            var exitBtn = document.getElementById('je-exit-btn');
            if (exitBtn) {
                exitBtn.addEventListener('click', function () {
                    if (window.JellyEmuNetplay && typeof window.JellyEmuNetplay.dispose === 'function') {
                        window.JellyEmuNetplay.dispose();
                    }
                    if (window.EJS_onExit) { EJS_onExit(); }
                    else if (window.opener) { window.close(); }
                    else { window.parent.postMessage('close-jellyemu', '*'); }
                });
            }

            // Fullscreen
            var btnFs = document.getElementById('je-btn-fullscreen');
            var iconEnter = document.getElementById('je-fs-enter');
            var iconExit = document.getElementById('je-fs-exit');

            if (btnFs) {
                btnFs.addEventListener('click', function () {
                    if (!document.fullscreenElement) {
                        document.body.requestFullscreen().catch(function (err) {
                            console.warn('[JellyEmu] Fullscreen failed:', err);
                        });
                    } else {
                        if (document.exitFullscreen) {
                            document.exitFullscreen();
                        }
                    }
                });
            }

            // Listen for the state change so the UI updates even if the user presses 'Esc'
            document.addEventListener('fullscreenchange', function () {
                if (document.fullscreenElement) {
                    if (iconEnter) iconEnter.style.display = 'none';
                    if (iconExit) iconExit.style.display = '';
                    if (btnFs) btnFs.title = 'Exit Fullscreen';
                } else {
                    if (iconEnter) iconEnter.style.display = '';
                    if (iconExit) iconExit.style.display = 'none';
                    if (btnFs) btnFs.title = 'Fullscreen';
                }
            });

            // Pause / Play
            var btnPause = document.getElementById('je-btn-pause');
            var btnPlay = document.getElementById('je-btn-play');
            if (btnPause) {
                btnPause.addEventListener('click', function () {
                    var e = emu(); if (!e || !e.started) return;
                    e.pause();
                    btnPause.style.display = 'none'; if (btnPlay) btnPlay.style.display = '';
                    if (typeof window._jePauseSessionTracking === 'function') window._jePauseSessionTracking();
                });
            }
            if (btnPlay) {
                btnPlay.addEventListener('click', function () {
                    var e = emu(); if (!e || !e.started) return;
                    e.play();
                    btnPlay.style.display = 'none'; if (btnPause) btnPause.style.display = '';
                    if (typeof window._jeResumeSessionTracking === 'function') window._jeResumeSessionTracking();
                });
            }

            // Auto-Pause (Reduces battery & CPU usage when tab is hidden, unless hosting Netplay)
            var _autoPausedByBackground = false;
            document.addEventListener('visibilitychange', function () {
                var e = emu();
                if (!e || !e.started) return;

                // Never auto-pause in background if active in Netplay (especially when hosting)
                var isNetplayActive = (e.isNetplay && e.netplay) || (window.JellyEmuNetplay && window.JellyEmuNetplay.inRoom);
                var isHosting = isNetplayActive && ((e.netplay && e.netplay.owner) || (window.JellyEmuNetplay && window.JellyEmuNetplay.isHost));
                if (isHosting || isNetplayActive) return;

                if (document.hidden) {
                    if (!e.paused) {
                        _autoPausedByBackground = true;
                        try { e.pause(); } catch (_) { }
                        if (btnPause && btnPlay) {
                            btnPause.style.display = 'none';
                            btnPlay.style.display = '';
                        }
                        if (typeof window._jePauseSessionTracking === 'function') window._jePauseSessionTracking();
                    }
                } else {
                    if (_autoPausedByBackground) {
                        _autoPausedByBackground = false;
                        try { e.play(); } catch (_) { }
                        if (btnPause && btnPlay) {
                            btnPlay.style.display = 'none';
                            btnPause.style.display = '';
                        }
                        if (typeof window._jeResumeSessionTracking === 'function') window._jeResumeSessionTracking();
                    }
                }
            });

            // Restart
            var btnRestart = document.getElementById('je-btn-restart');
            if (btnRestart) {
                btnRestart.addEventListener('click', function () {
                    var g = gm(); if (g) g.restart();
                });
            }

            // Fast Forward
            window._jeFFActive = false;
            var btnFf = document.getElementById('je-btn-ff');
            if (btnFf) {
                btnFf.addEventListener('click', function () {
                    var g = gm(); if (!g) return;
                    window._jeFFActive = !window._jeFFActive;
                    if (window._jeFFActive) {
                        window._jeSlowActive = false;
                        if (g.toggleSlowMotion) g.toggleSlowMotion(0);
                        var slowBtn = document.getElementById('je-btn-slow');
                        if (slowBtn) slowBtn.classList.remove('je-active');
                    }
                    g.toggleFastForward(window._jeFFActive ? 1 : 0);
                    this.classList.toggle('je-active', window._jeFFActive);
                    try {
                        window.dispatchEvent(new CustomEvent('jellyemu:speed-changed', {
                            detail: { ff: !!window._jeFFActive, slow: !!window._jeSlowActive }
                        }));
                    } catch (_) {}
                });
            }

            // Slow Motion
            window._jeSlowActive = false;
            var btnSlow = document.getElementById('je-btn-slow');
            if (btnSlow) {
                btnSlow.addEventListener('click', function () {
                    var g = gm(); if (!g) return;
                    window._jeSlowActive = !window._jeSlowActive;
                    if (window._jeSlowActive) {
                        window._jeFFActive = false;
                        if (g.toggleFastForward) g.toggleFastForward(0);
                        var ffBtn = document.getElementById('je-btn-ff');
                        if (ffBtn) ffBtn.classList.remove('je-active');
                    }
                    g.toggleSlowMotion(window._jeSlowActive ? 1 : 0);
                    this.classList.toggle('je-active', window._jeSlowActive);
                    try {
                        window.dispatchEvent(new CustomEvent('jellyemu:speed-changed', {
                            detail: { ff: !!window._jeFFActive, slow: !!window._jeSlowActive }
                        }));
                    } catch (_) {}
                });
            }

            // Volume & Mute manager (Global user preference)
            var _jeSavedVol = parseFloat('{{ volume }}');
            if (isNaN(_jeSavedVol) || _jeSavedVol < 0) _jeSavedVol = 1.0;
            var _jeSavedMuted = ('{{ mute }}' === '1');

            var _jeCurrentVol = _jeSavedMuted ? 0 : _jeSavedVol;
            var _jeLastVol = _jeSavedVol > 0 ? _jeSavedVol : 1.0;

            function applyLiveAudio() {
                var e = emu();
                if (!e) return;
                try {
                    if (typeof e.setVolume === 'function') e.setVolume(_jeCurrentVol);
                    e.volume = _jeCurrentVol;
                } catch (err) { }
            }

            var _jeVolSaveTimer = null;
            function syncAudioToServer() {
                var userId = '{{ user_id }}';
                if (!userId || typeof _jellyToken === 'undefined' || !_jellyToken) return;

                clearTimeout(_jeVolSaveTimer);
                _jeVolSaveTimer = setTimeout(function () {
                    var volToSave = (_jeCurrentVol > 0 ? _jeCurrentVol : _jeLastVol).toString();
                    var muteToSave = (_jeCurrentVol === 0 ? '1' : '0');

                    fetch((window.JellyEmuConfig.baseUrl || '') + '/jellyemu/prefs/' + userId, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'MediaBrowser Token="' + _jellyToken + '"'
                        },
                        body: JSON.stringify({
                            scope: 'global',
                            targetId: '',
                            preferences: {
                                volume: volToSave,
                                mute: muteToSave
                            }
                        })
                    }).catch(function (e) { console.warn('[JellyEmu] Failed syncing audio preferences:', e); });
                }, 400);
            }

            window.addEventListener('jellyemu:gamestart', function () {
                setTimeout(applyLiveAudio, 100);
                setTimeout(applyLiveAudio, 500);

            var btnVol = document.getElementById('je-btn-vol');
            if (btnVol) {
                btnVol.addEventListener('click', function () {
                    var e = emu();
                    if (e) {
                        var slider = document.getElementById('je-vol-slider');
                        var isMuted = (_jeCurrentVol === 0);

                        // Sync the UI to our session tracker
                        if (slider) slider.value = _jeCurrentVol;
                        var pctEl = document.getElementById('je-vol-pct');
                        if (pctEl) pctEl.textContent = Math.round(_jeCurrentVol * 100) + '%';
                        var muteEl = document.getElementById('je-vol-mute');
                        if (muteEl) muteEl.textContent = isMuted ? 'Unmute' : 'Mute';

                        applyLiveAudio();
                    }
                    openPopup('je-pop-vol');
                });
            }

            var volSlider = document.getElementById('je-vol-slider');
            if (volSlider) {
                volSlider.addEventListener('input', function () {
                    var v = parseFloat(this.value);
                    _jeCurrentVol = v;
                    if (v > 0) _jeLastVol = v;

                    var pctEl = document.getElementById('je-vol-pct');
                    if (pctEl) pctEl.textContent = Math.round(v * 100) + '%';

                    var e = emu();
                    if (e) {
                        applyLiveAudio();
                        var muteEl = document.getElementById('je-vol-mute');
                        if (muteEl) {
                            if (v > 0) {
                                muteEl.textContent = 'Mute';
                            } else {
                                muteEl.textContent = 'Unmute';
                            }
                        }
                    }
                    syncAudioToServer();
                });
            }

            var volMute = document.getElementById('je-vol-mute');
            if (volMute) {
                volMute.addEventListener('click', function () {
                    var e = emu();
                    if (!e) return;

                    var slider = document.getElementById('je-vol-slider');

                    if (_jeCurrentVol > 0) {
                        // Action: Mute
                        _jeLastVol = _jeCurrentVol;
                        _jeCurrentVol = 0;

                        applyLiveAudio();
                        if (slider) slider.value = 0;
                        var pctEl = document.getElementById('je-vol-pct');
                        if (pctEl) pctEl.textContent = '0%';
                        this.textContent = 'Unmute';
                    } else {
                        // Action: Unmute
                        var restoreVol = _jeLastVol > 0 ? _jeLastVol : 1.0;
                        _jeCurrentVol = restoreVol;

                        applyLiveAudio();
                        if (slider) slider.value = restoreVol;
                        var pctEl = document.getElementById('je-vol-pct');
                        if (pctEl) pctEl.textContent = Math.round(restoreVol * 100) + '%';
                        this.textContent = 'Mute';
                    }
                    syncAudioToServer();
                });
            }

            // Cheats popup — cheats are loaded lazily on first open, never injected at startup.
            // Only individually toggled cheats are ever passed to the emulator via cheatChanged().
            var _jeCheatsLoaded = false;
            var _jeCheatsDb = []; // [{ desc, code, checked }] from server

            function buildCheats() {
                var e = emu(); if (!e) return;
                var list = document.getElementById('je-cheat-list');
                if (!list) return;
                list.innerHTML = '';

                // Merge server cheat db with any user-added cheats already in e.cheats
                // User-added cheats have no matching entry in _jeCheatsDb
                var allCheats = _jeCheatsDb.map(function (ch) {
                    // Find matching entry in e.cheats to preserve toggled state
                    var live = (e.cheats || []).find(function (c) { return c.code === ch.code; });
                    return { desc: ch.desc, code: ch.code, checked: live ? !!live.checked : false, fromDb: true };
                });
                // Append any user-added cheats not in the db
                (e.cheats || []).forEach(function (c) {
                    if (!_jeCheatsDb.find(function (db) { return db.code === c.code; })) {
                        allCheats.push({ desc: c.desc, code: c.code, checked: !!c.checked, fromDb: false });
                    }
                });

                if (allCheats.length === 0) {
                    list.innerHTML = '<div style="opacity:.4;font-size:13px">No cheats found for this game</div>';
                    return;
                }

                allCheats.forEach(function (ch, idx) {
                    var row = document.createElement('div');
                    row.className = 'je-cheat-row';
                    row.innerHTML = '<label class="je-toggle"><input type="checkbox"' + (ch.checked ? ' checked' : '') +
                        '><span class="je-toggle-track"></span></label><span class="je-cheat-name">' +
                        ch.desc + '</span>' + (!ch.fromDb ? '<button class="je-cheat-del">&times;</button>' : '');

                    var cb = row.querySelector('input');
                    cb.addEventListener('change', function () {
                        ch.checked = cb.checked;
                        // Find or create the entry in e.cheats and toggle it
                        var liveIdx = (e.cheats || []).findIndex(function (c) { return c.code === ch.code; });
                        if (cb.checked) {
                            if (liveIdx === -1) {
                                e.cheats = e.cheats || [];
                                e.cheats.push({ desc: ch.desc, code: ch.code, checked: true });
                                liveIdx = e.cheats.length - 1;
                            } else {
                                e.cheats[liveIdx].checked = true;
                            }
                        } else {
                            if (liveIdx !== -1) e.cheats[liveIdx].checked = false;
                        }
                        e.cheatChanged(cb.checked, ch.code, liveIdx === -1 ? 0 : liveIdx);
                        e.saveSettings();
                    });

                    var del = row.querySelector('.je-cheat-del');
                    if (del) {
                        del.addEventListener('click', function () {
                            var liveIdx = (e.cheats || []).findIndex(function (c) { return c.code === ch.code; });
                            if (liveIdx !== -1) {
                                e.cheatChanged(false, ch.code, liveIdx);
                                e.cheats.splice(liveIdx, 1);
                            }
                            allCheats.splice(idx, 1);
                            e.saveSettings();
                            buildCheats();
                        });
                    }
                    list.appendChild(row);
                });
            }

            var btnCheats = document.getElementById('je-btn-cheats');
            if (btnCheats) {
                btnCheats.addEventListener('click', function () {
                    openPopup('je-pop-cheats');
                    if (_jeCheatsLoaded) {
                        buildCheats();
                        return;
                    }
                    var list = document.getElementById('je-cheat-list');
                    if (list) list.innerHTML = '<div style="opacity:.4;font-size:13px">Loading cheats…</div>';
                    var headers = {};
                    if (typeof _jellyToken !== 'undefined' && _jellyToken) {
                        headers['Authorization'] = 'MediaBrowser Token="' + _jellyToken + '"';
                    }
                    fetch((window.JellyEmuConfig.baseUrl || '') + '/jellyemu/cheats/{{ item_id }}', { headers: headers })
                        .then(function (r) { return r.json(); })
                        .then(function (data) {
                            _jeCheatsLoaded = true;
                            // data is [[name, code, status], ...] from the server
                            _jeCheatsDb = (data || []).map(function (entry) {
                                return { desc: entry[0], code: entry[1], checked: false };
                            });
                            buildCheats();
                        })
                        .catch(function () {
                            _jeCheatsLoaded = true; // don't retry on error
                            buildCheats();
                        });
                });
            }

            var btnCheatAdd = document.getElementById('je-cheat-add');
            if (btnCheatAdd) {
                btnCheatAdd.addEventListener('click', function () {
                    var nameEl = document.getElementById('je-cheat-name');
                    var codeEl = document.getElementById('je-cheat-code');
                    var name = nameEl ? nameEl.value.trim() : '';
                    var code = codeEl ? codeEl.value.trim() : '';
                    if (!name || !code) return;
                    var e = emu(); if (!e) return;
                    e.cheats = e.cheats || [];
                    e.cheats.push({ desc: name, code: code, checked: false });
                    e.saveSettings();
                    if (nameEl) nameEl.value = '';
                    if (codeEl) codeEl.value = '';
                    buildCheats();
                });
            }

            // Screenshot — uploads to the configured screenshots folder when set,
            // otherwise downloads in the browser.
            var _jeShotsToLibrary = {{ screenshots_to_library }};
            function _jeHandleShot(dataUrl) {
                if (!dataUrl || !dataUrl.startsWith('data:image')) return;
                if (window.JellyEmu && typeof window.JellyEmu.uploadScreenshot === 'function') {
                    window.JellyEmu.uploadScreenshot('{{ item_id }}', dataUrl, {
                        toLibrary: _jeShotsToLibrary,
                        gameName: window.EJS_gameName || 'screenshot'
                    }).then(function (ok) {
                        if (ok && _jeShotsToLibrary) {
                            var btn = document.getElementById('je-btn-screenshot');
                            if (btn) {
                                btn.style.filter = 'drop-shadow(0 0 6px #7f7)';
                                setTimeout(function () { btn.style.filter = ''; }, 800);
                            }
                        }
                    });
                }
                try {
                    window.parent.postMessage({ type: 'jellyemu-screenshot', itemId: '{{ item_id }}', dataUrl: dataUrl }, '*');
                } catch (ex) { }
            }

            var btnScreenshot = document.getElementById('je-btn-screenshot');
            if (btnScreenshot) {
                btnScreenshot.addEventListener('click', function () {
                    var dataUrl = _jeCaptureCanvas('image/png');
                    if (dataUrl && dataUrl.startsWith('data:image')) return _jeHandleShot(dataUrl);

                    var g = gm(); if (!g) return;
                    g.screenshot().then(function (pngBytes) {
                        var fr = new FileReader();
                        fr.onload = function () { _jeHandleShot(fr.result); };
                        fr.readAsDataURL(new Blob([pngBytes], { type: 'image/png' }));
                    }).catch(function (err) { console.warn('[JellyEmu] Screenshot failed:', err); });
                });
            }

            // Dock minimize / expand
            var dockMinimized = false;
            var dockMinBtn = document.getElementById('je-dock-min');
            if (dock && dockMinBtn) {
                var minDockBtn = document.createElement('button');
                minDockBtn.className = 'je-dockbtn';
                minDockBtn.title = 'Minimize';
                minDockBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z" fill="currentColor"/></svg>';
                dock.appendChild(minDockBtn);
                minDockBtn.addEventListener('click', function () {
                    dockMinimized = true;
                    dock.classList.add('je-minimized');
                    dockMinBtn.classList.add('je-active');
                    dockMinBtn.classList.remove('je-hidden');
                    if (topbar) topbar.classList.add('je-hidden');
                });
                dockMinBtn.addEventListener('click', function () {
                    dockMinimized = false;
                    dock.classList.remove('je-minimized');
                    dockMinBtn.classList.remove('je-active');
                    showDocks();
                });
            }

            var _origShowDocks = showDocks;
            showDocks = function () {
                _origShowDocks();
                if (dockMinimized) {
                    if (topbar) topbar.classList.add('je-hidden');
                    if (dockMinBtn) dockMinBtn.classList.remove('je-hidden');
                }
            };
        })();
    </script>
    <script>
        window.EJS_player = '#game';
        window.EJS_gameUrl = '{{ rom_url }}';
        window.EJS_gameName = '{{ game_name }}';
        window.EJS_pathtodata = '{{ ejs_base }}/';
        window.EJS_startOnLoaded = true;
        window.EJS_startOnLoad = true;
        window.EJS_askBeforeExit = true;
        window.EJS_color = '#00a4dc';

        window.EJS_DEBUG_XX = window.debug;
        if (window.language !== "auto") {
            window.EJS_language = window.language;
        }

        var _initShader = '{{ active_shader }}' || 'crt-easymode.glslp';
        if (_initShader && _initShader !== 'none' && _initShader !== 'disabled' && _initShader !== '0') {
            if (!_initShader.endsWith('.glslp') && !_initShader.endsWith('.glsl')) _initShader += '.glslp';
        } else {
            _initShader = 'disabled';
        }

        // Inject default options for save states, shader, vsync, and speed rates
        window.EJS_defaultOptions = {
            'shader': _initShader,
            'ff-ratio': '{{ ffrate }}' || '3',
            'sm-ratio': '{{ smrate }}' || '3'
        };
        var _initRot = parseInt('{{ video_rotation }}') || 0;
        if (_initRot === 90 || _initRot === 1) window.EJS_videoRotation = 1;
        else if (_initRot === 180 || _initRot === 2) window.EJS_videoRotation = 2;
        else if (_initRot === 270 || _initRot === 3) window.EJS_videoRotation = 3;
        else window.EJS_videoRotation = 0;

        {{ if needs_threads }}
        // Threads need SharedArrayBuffer, which is only available on a cross-origin isolated
        // page, which requires a trustworthy origin (HTTPS or localhost). Over plain HTTP,
        // the cross-origin headers are ignored, so we'll let EmulatorJS know to use threads
        // only when SharedArrayBuffer is available.
        if (typeof SharedArrayBuffer === 'function') {
            window.EJS_threads = true;
        } else {
            console.warn('[JellyEmu] SharedArrayBuffer unavailable, so running single-threaded. ' +
                'Use HTTPS to enable threading.');
        }
        {{ else }}
        // EJS_threads not required for this core
        {{ end }}

        {{ if igdb_id && igdb_id != "" }}
        window.EJS_gameID = {{ igdb_id }};
        {{ else }}
        window.EJS_gameID = {{ game_id }};
        {{ end }}

        window.EJS_netplayServer = '{{ netplay_server }}';
        window.EJS_netplayICEServers = {{ netplay_ice_servers_json }};

        {{ if save_exists }}
        window.EJS_loadStateURL = '{{ save_get_url }}';
        {{ end }}

        {{ if has_saves }}
        var _jellyToken = window._jellyToken || '';
        var _jellyEmuSessionStarted = false;
        var _jellyEmuPingInterval = null;
        var _totalActivePlaytimeMs = 0;
        var _lastActiveResumeTime = Date.now();
        var _isSessionActive = true;

        function _jeGetActivePlaytimeSeconds() {
            var total = _totalActivePlaytimeMs;
            if (_isSessionActive) {
                total += (Date.now() - _lastActiveResumeTime);
            }
            return Math.max(0, Math.round(total / 1000));
        }

        function _jeSendSessionPing(isPaused) {
            if (!_jellyEmuSessionStarted) return;
            var pingHeaders = {};
            if (typeof _jellyToken !== 'undefined' && _jellyToken) {
                pingHeaders['Authorization'] = 'MediaBrowser Token="' + _jellyToken + '"';
            }
            var secs = _jeGetActivePlaytimeSeconds();
            var query = '?isPaused=' + (isPaused ? 'true' : 'false') + '&seconds=' + secs;
            fetch((window.JellyEmuConfig.baseUrl || '') + '/jellyemu/session/ping/{{ item_id }}/{{ user_id }}' + query, {
                method: 'POST',
                headers: pingHeaders
            }).catch(function () { });
        }

        function _jePauseSessionTracking() {
            if (_isSessionActive) {
                _totalActivePlaytimeMs += (Date.now() - _lastActiveResumeTime);
                _isSessionActive = false;
                _jeSendSessionPing(true);
            }
        }

        function _jeResumeSessionTracking() {
            if (!_isSessionActive) {
                _lastActiveResumeTime = Date.now();
                _isSessionActive = true;
                _jeSendSessionPing(false);
            }
        }

        window._jePauseSessionTracking = _jePauseSessionTracking;
        window._jeResumeSessionTracking = _jeResumeSessionTracking;

        // Single Session Guarantee: Start session ONLY after game actually boots
        window.addEventListener('jellyemu:gamestart', function () {
            if (_jellyEmuSessionStarted) return;
            _jellyEmuSessionStarted = true;
            _totalActivePlaytimeMs = 0;
            _lastActiveResumeTime = Date.now();
            _isSessionActive = true;

            // Mark game as played in Jellyfin when the game starts
            var playedHeaders = (window.JellyEmu && typeof window.JellyEmu.getAuthHeaders === 'function')
                ? window.JellyEmu.getAuthHeaders(_jellyToken)
                : {
                    'X-Emby-Authorization': 'MediaBrowser Client="JellyEmu", Device="Browser", DeviceId="jellyemu", Version="1.0", Token="' + _jellyToken + '"',
                    'Authorization': 'MediaBrowser Token="' + _jellyToken + '"',
                    'X-MediaBrowser-Token': _jellyToken,
                    'X-Emby-Token': _jellyToken
                };

            var playedUrl = (window.JellyEmu && typeof window.JellyEmu.getUrl === 'function')
                ? window.JellyEmu.getUrl('/Users/{{ user_id }}/PlayedItems/{{ item_id }}')
                : ((window.JellyEmuConfig.baseUrl || '') + '/Users/{{ user_id }}/PlayedItems/{{ item_id }}');

            fetch(playedUrl, {
                method: 'POST',
                headers: playedHeaders
            }).catch(function (err) {
                console.warn('[JellyEmu] Could not mark item as played:', err);
            });

            // Open a Jellyfin session so the game appears in Dashboard → Active Sessions
            var _jellyEmuDeviceId = 'jellyemu-' + Math.random().toString(36).slice(2, 10);
            var startHeaders = {
                'X-JellyEmu-DeviceId': _jellyEmuDeviceId,
                'X-JellyEmu-DeviceName': (navigator.userAgent.indexOf('Mobi') !== -1 ? 'JellyEmu Mobile' : 'JellyEmu Browser')
            };
            if (typeof _jellyToken !== 'undefined' && _jellyToken) {
                startHeaders['Authorization'] = 'MediaBrowser Token="' + _jellyToken + '"';
                startHeaders['X-MediaBrowser-Token'] = _jellyToken;
                startHeaders['X-Emby-Token'] = _jellyToken;
            }
            var startUrl = (window.JellyEmu && typeof window.JellyEmu.getUrl === 'function')
                ? window.JellyEmu.getUrl('/jellyemu/session/start/{{ item_id }}/{{ user_id }}')
                : ((window.JellyEmuConfig.baseUrl || '') + '/jellyemu/session/start/{{ item_id }}/{{ user_id }}');

            fetch(startUrl, {
                method: 'POST',
                headers: startHeaders
            }).catch(function (err) {
                console.warn('[JellyEmu] Could not open session:', err);
            });

            // Ping the session every 30 s to keep it alive and advance the elapsed timer
            _jellyEmuPingInterval = setInterval(function () {
                // Do not report active session when in background or paused
                if (document.hidden || !_isSessionActive) return;
                var e = (typeof emu === 'function') ? emu() : null;
                if (e && e.paused) return;

                _jeSendSessionPing(false);
            }, 30000);

            try {
                window.dispatchEvent(new CustomEvent('jellyemu:session:start', {
                    detail: { itemId: '{{ item_id }}', userId: '{{ user_id }}', deviceId: _jellyEmuDeviceId }
                }));
            } catch (_) {}
        });

        function _jeCaptureCanvas(format, quality) {
            try {
                var canvas = document.querySelector('canvas.ejs_canvas') ||
                    document.querySelector('#game canvas') ||
                    document.querySelector('canvas');
                if (canvas && canvas.width > 0 && canvas.height > 0) {
                    var mime = format || 'image/jpeg';
                    var qual = (typeof quality === 'number') ? quality : (mime === 'image/png' ? undefined : 0.90);

                    var rect = canvas.getBoundingClientRect();
                    var displayW = Math.round(rect.width);
                    var displayH = Math.round(rect.height);

                    var targetW = displayW;
                    var targetH = displayH;

                    // If displayed with object-fit: contain, compute actual rendered image dimensions inside canvas element
                    var style = window.getComputedStyle(canvas);
                    var objectFit = style.objectFit || 'contain';

                    if (objectFit === 'contain' && displayW > 0 && displayH > 0 && canvas.height > 0) {
                        var aspect = canvas.width / canvas.height;
                        targetW = displayW;
                        targetH = Math.round(displayW / aspect);
                        if (targetH > displayH) {
                            targetH = displayH;
                            targetW = Math.round(displayH * aspect);
                        }
                    }

                    if (targetW > 0 && targetH > 0 && (targetW !== canvas.width || targetH !== canvas.height)) {
                        var offscreen = document.createElement('canvas');
                        offscreen.width = targetW;
                        offscreen.height = targetH;
                        var ctx = offscreen.getContext('2d');
                        if (ctx) {
                            ctx.imageSmoothingEnabled = false;
                            ctx.drawImage(canvas, 0, 0, targetW, targetH);
                            return offscreen.toDataURL(mime, qual);
                        }
                    }

                    return canvas.toDataURL(mime, qual);
                }
            } catch (e) { console.warn('[JellyEmu] Screenshot capture failed:', e); }
            return null;
        }

        function _jeUploadScreenshot(slot, afterPromise) {
            var dataUrl = _jeCaptureCanvas();
            if (!dataUrl || !dataUrl.startsWith('data:image')) return;
            (afterPromise || Promise.resolve()).then(function () {
                fetch((window.JellyEmuConfig.baseUrl || '') + '/jellyemu/save-screenshot/{{ item_id }}/{{ user_id }}/' + slot, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'MediaBrowser Token="' + (_jellyToken || '') + '"'
                    },
                    body: JSON.stringify({ dataUrl: dataUrl })
                }).catch(function () { });
            });
        }

        window._jeCaptureCanvas = _jeCaptureCanvas;
        window._jeUploadScreenshot = _jeUploadScreenshot;

        window.EJS_onSaveState = function (e) {
            if (!e || !e.state) return;
            var state = _jeEnsureBinary(e.state);
            console.log('[JellyEmu] Pipeline STAGE 1 (Client AutoGen): Payload size ->', state.size || state.byteLength, 'bytes');
            var savePromise = fetch('{{ save_post_url }}', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/octet-stream',
                    'Authorization': 'MediaBrowser Token="' + (_jellyToken || '') + '"'
                },
                body: state
            }).then(function (r) {
                if (!r.ok) throw new Error('Server rejected save');
                console.log('[JellyEmu] Save uploaded, status:', r.status);
                try { window.parent.postMessage({ type: 'jellyemu-save-written', itemId: '{{ item_id }}' }, '*'); } catch (_) { }
            }).catch(function (err) {
                console.error('[JellyEmu] Save upload failed:', err);
            });
            _jeUploadScreenshot(activeSlot, savePromise);
        };

        var _jellyEmuExiting = false;
        window.EJS_onExit = function () {
            if (_jellyEmuExiting) return;
            _jellyEmuExiting = true;

            var prefs = {};
            try { prefs = JSON.parse(localStorage.getItem('jellyemu-userprefs') || '{}'); } catch (e) { }
            var autoSave = prefs.autosave !== 'false'; // default on

            // Stop the session ping and close the Jellyfin session
            clearInterval(_jellyEmuPingInterval);
            _jePauseSessionTracking();
            var sessionSeconds = _jeGetActivePlaytimeSeconds();

            var stopHeaders = {};
            if (typeof _jellyToken !== 'undefined' && _jellyToken) {
                stopHeaders['Authorization'] = 'MediaBrowser Token="' + _jellyToken + '"';
            }
            var sessionStop = fetch((window.JellyEmuConfig.baseUrl || '') + '/jellyemu/session/stop/{{ item_id }}/{{ user_id }}?seconds=' + sessionSeconds, {
                method: 'POST',
                headers: stopHeaders
            }).catch(function () { });

            // Always record playtime for this session (excluding paused/background time)
            var playtimeFlush = sessionSeconds > 0
                ? fetch((window.JellyEmuConfig.baseUrl || '') + '/jellyemu/playtime/{{ item_id }}/{{ user_id }}', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'text/plain',
                        'Authorization': 'MediaBrowser Token="' + (_jellyToken || '') + '"'
                    },
                    body: String(sessionSeconds)
                }).catch(function () { })
                : Promise.resolve();

            function closeIframe() {
                if (window.JellyEmuNetplay && typeof window.JellyEmuNetplay.dispose === 'function') {
                    window.JellyEmuNetplay.dispose();
                }
                if (window.parent === window) {
                    try { var ch = new BroadcastChannel('jellyemu-exit'); ch.postMessage('close-jellyemu'); ch.close(); } catch (e) { }
                    if (window.history.length > 1) {
                        window.history.back();
                    } else {
                        window.location.href = (window.JellyEmuConfig.baseUrl || '') + '/web/#/details?id={{ item_id }}';
                    }
                } else {
                    window.parent.postMessage('close-jellyemu', '*');
                }
            }

            function _fallbackClose() {
                Promise.all([sessionStop, playtimeFlush]).finally(function () {
                    try { window.parent.postMessage({ type: 'jellyemu-session-end', itemId: '{{ item_id }}', seconds: sessionSeconds }, '*'); } catch (_) { }
                    closeIframe();
                });
            }

            if (!autoSave) {
                _fallbackClose();
                return;
            }

            _fallbackClose();
        };

        // Hook EmulatorJS screenshot button to push to Romm via parent
        document.addEventListener('click', function (ev) {
            var btn = ev.target.closest && ev.target.closest('[data-action="screenshot"], .ejs-screenshot-btn, button[title*="creenshot"], button[aria-label*="creenshot"]');
            if (!btn) return;
            setTimeout(function () {
                try {
                    var s = window._jeCaptureCanvas();
                    window.parent.postMessage({ type: 'jellyemu-screenshot', itemId: '{{ item_id }}', dataUrl: s }, '*');
                } catch (e) { console.warn('[JellyEmu] Screenshot capture failed:', e); }
            }, 200);
        });
        {{ end }}
    </script>
