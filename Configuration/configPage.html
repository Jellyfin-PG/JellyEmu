<div id="JellyEmuConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
    <div data-role="content">
        <div class="content-primary">

            <!-- Premium Header with Inline SVG Logo -->
            <div class="je-header" style="display: flex; align-items: center; gap: 14px; margin-bottom: 2em;">
                <div class="je-logo-container" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: rgba(0, 164, 220, 0.15); border: 1.5px solid rgba(0, 164, 220, 0.4); border-radius: 12px; padding: 6px;">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#00a4dc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;">
                        <path d="M12 2L3 18a2 2 0 0 0 1.7 3h14.6a2 2 0 0 0 1.7-3L12 2z" />
                        <path d="M7.5 15.5h3M9 14v3" stroke="#00a4dc" stroke-width="1.2" />
                        <circle cx="15.5" cy="14.5" r="0.8" fill="#00a4dc" stroke="none" />
                        <circle cx="17" cy="16.5" r="0.8" fill="#00a4dc" stroke="none" />
                    </svg>
                </div>
                <div>
                    <h2 style="margin: 0; font-size: 1.8em; font-weight: 600; color: #fff;">JellyEmu</h2>
                    <p style="margin: 2px 0 0; color: #aaa; font-size: 0.9em;">Retro Games Library Integration</p>
                </div>
            </div>

            <!-- Tab Navigation Bar -->
            <div class="je-tabs-nav" style="display: flex; gap: 4px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 2em; padding-bottom: 2px; overflow-x: auto; white-space: nowrap;">
                <button type="button" class="je-tab-btn active" data-tab="statistics" onclick="jeSwitchTab('statistics')">
                    <span class="material-icons">bar_chart</span>
                    <span>Statistics</span>
                </button>
                <button type="button" class="je-tab-btn" data-tab="settings" onclick="jeSwitchTab('settings')">
                    <span class="material-icons">settings</span>
                    <span>Settings</span>
                </button>
                <button type="button" class="je-tab-btn" data-tab="marketplace" onclick="jeSwitchTab('marketplace')">
                    <span class="material-icons">shopping_bag</span>
                    <span>Marketplace</span>
                </button>
                <button type="button" class="je-tab-btn" data-tab="community" onclick="jeSwitchTab('community')">
                    <span class="material-icons">forum</span>
                    <span>Community</span>
                </button>
                <button type="button" class="je-tab-btn" data-tab="api" onclick="jeSwitchTab('api')">
                    <span class="material-icons">code</span>
                    <span>API Doc</span>
                </button>
                <button type="button" class="je-tab-btn" data-tab="about" onclick="jeSwitchTab('about')">
                    <span class="material-icons">info</span>
                    <span>About</span>
                </button>
            </div>

            <!-- Tab Styles and Component Styles -->
            <style>
                .je-tab-btn {
                    background: none !important;
                    border: none !important;
                    padding: 10px 20px !important;
                    color: #aaa !important;
                    cursor: pointer !important;
                    font-size: 0.95em !important;
                    font-weight: 600 !important;
                    display: inline-flex !important;
                    align-items: center !important;
                    gap: 8px !important;
                    border-bottom: 2px solid transparent !important;
                    transition: color 0.15s, border-color 0.15s !important;
                    outline: none !important;
                    box-shadow: none !important;
                }
                .je-tab-btn .material-icons {
                    font-size: 18px !important;
                }
                .je-tab-btn:hover {
                    color: #fff !important;
                }
                .je-tab-btn.active {
                    color: #00a4dc !important;
                    border-bottom-color: #00a4dc !important;
                }
                .je-tab-content {
                    display: none;
                }
                .je-tab-content.active {
                    display: block;
                    max-height: calc(100vh - 210px);
                    overflow-y: auto;
                    overflow-x: hidden;
                    padding-right: 6px;
                    box-sizing: border-box;
                }
                .je-tab-content.active::-webkit-scrollbar {
                    width: 6px;
                }
                .je-tab-content.active::-webkit-scrollbar-track {
                    background: rgba(0, 0, 0, 0.1);
                    border-radius: 4px;
                }
                .je-tab-content.active::-webkit-scrollbar-thumb {
                    background: rgba(255, 255, 255, 0.15);
                    border-radius: 4px;
                }
                .je-tab-content.active::-webkit-scrollbar-thumb:hover {
                    background: rgba(0, 164, 220, 0.5);
                }

                .je-toggle-row {
                    display: flex;
                    align-items: center;
                    gap: 14px;
                    margin-bottom: 1em;
                }

                .je-toggle-btn {
                    flex-shrink: 0;
                    min-width: 90px;
                    padding: 5px 14px;
                    border-radius: 4px;
                    border: 1px solid rgba(255, 255, 255, 0.2);
                    cursor: pointer;
                    font-size: 0.82em;
                    font-weight: 600;
                    letter-spacing: 0.04em;
                    text-transform: uppercase;
                    transition: background 0.15s, border-color 0.15s;
                    background: rgba(255, 255, 255, 0.06);
                    color: #aaa;
                }

                .je-toggle-btn.je-on {
                    background: rgba(82, 181, 75, 0.18);
                    border-color: rgba(82, 181, 75, 0.55);
                    color: #52B54B;
                }

                .je-toggle-label {
                    color: #ccc;
                    font-size: 0.92em;
                    line-height: 1.3;
                }

                #JellyEmuConfigPage select,
                #JellyEmuConfigPage select.emby-select,
                #JellyEmuConfigPage select.emby-select option,
                #JellyEmuConfigPage option,
                .je-bios-sys-select,
                .je-bios-sys-select option {
                    background-color: #000000 !important;
                    background: #000000 !important;
                    color: #ffffff !important;
                }

                #JellyEmuConfigPage select:focus,
                #JellyEmuConfigPage select.emby-select:focus {
                    background-color: #000000 !important;
                    background: #000000 !important;
                }

                .je-toggle-label small {
                    display: block;
                    color: #777;
                    font-size: 0.88em;
                    margin-top: 2px;
                }

                .je-api-item {
                    background: rgba(255, 255, 255, 0.02);
                    border: 1px solid rgba(255, 255, 255, 0.06);
                    border-radius: 8px;
                    padding: 1.25em;
                    margin-bottom: 1.25em;
                    transition: background 0.15s, border-color 0.15s;
                }
                .je-api-item:hover {
                    background: rgba(255, 255, 255, 0.04);
                    border-color: rgba(255, 255, 255, 0.1);
                }
                .je-api-header {
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    margin-bottom: 6px;
                    flex-wrap: wrap;
                }
                .je-api-method {
                    font-size: 0.72em;
                    font-weight: 700;
                    padding: 2px 8px;
                    border-radius: 4px;
                    text-transform: uppercase;
                    letter-spacing: 0.05em;
                }
                .je-api-method.get {
                    background: rgba(82, 181, 75, 0.12);
                    color: #52B54B;
                    border: 1px solid rgba(82, 181, 75, 0.25);
                }
                .je-api-method.post {
                    background: rgba(220, 140, 0, 0.12);
                    color: #dca000;
                    border: 1px solid rgba(220, 140, 0, 0.25);
                }
                .je-api-path {
                    font-family: monospace;
                    font-size: 1.02em;
                    color: #00a4dc;
                    word-break: break-all;
                }
                .je-api-desc {
                    color: #aaa;
                    font-size: 0.88em;
                    line-height: 1.45;
                    margin: 6px 0 0;
                }

                /* ROM Marketplace styles */
                @keyframes spin {
                    0% { transform: rotate(0deg); }
                    100% { transform: rotate(360deg); }
                }

                .je-spinner {
                    animation: spin 1s linear infinite;
                }

                .je-quick-add-btn {
                    background: rgba(255, 255, 255, 0.05) !important;
                    border: 1px solid rgba(255, 255, 255, 0.1) !important;
                    border-radius: 4px !important;
                    color: #ccc !important;
                    padding: 4px 10px !important;
                    font-size: 0.8em !important;
                    cursor: pointer !important;
                    transition: all 0.15s ease-in-out !important;
                    margin-right: 4px;
                    margin-bottom: 4px;
                }
                .je-quick-add-btn:hover {
                    background: rgba(0, 164, 220, 0.1) !important;
                    border-color: rgba(0, 164, 220, 0.4) !important;
                    color: #fff !important;
                }

                .je-provider-row {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    background: rgba(255, 255, 255, 0.03);
                    border: 1px solid rgba(255, 255, 255, 0.05);
                    border-radius: 6px;
                    padding: 8px 12px;
                }
                .je-provider-url {
                    font-family: monospace;
                    color: #fff;
                    font-size: 0.9em;
                }

                .je-console-grid {
                    display: grid;
                    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                    gap: 8px;
                }
                .je-console-card {
                    background: rgba(255, 255, 255, 0.03) !important;
                    border: 1px solid rgba(255, 255, 255, 0.06) !important;
                    border-radius: 6px !important;
                    color: #aaa !important;
                    padding: 10px 6px !important;
                    text-align: center !important;
                    font-weight: 600 !important;
                    cursor: pointer !important;
                    transition: all 0.2s ease-in-out !important;
                    box-shadow: none !important;
                }
                .je-console-card:hover {
                    color: #fff !important;
                    background: rgba(255, 255, 255, 0.08) !important;
                    transform: translateY(-2px);
                }
                .je-console-card.active {
                    color: #fff !important;
                    background: rgba(0, 164, 220, 0.2) !important;
                    border-color: #00a4dc !important;
                    box-shadow: 0 0 10px rgba(0, 164, 220, 0.3) !important;
                }

                .je-letter-row {
                    display: flex;
                    gap: 4px;
                    flex-wrap: nowrap;
                }
                .je-letter-btn {
                    background: rgba(255, 255, 255, 0.03) !important;
                    border: 1px solid rgba(255, 255, 255, 0.05) !important;
                    border-radius: 4px !important;
                    color: #888 !important;
                    min-width: 32px !important;
                    height: 32px !important;
                    font-size: 0.85em !important;
                    font-weight: 700 !important;
                    cursor: pointer !important;
                    display: inline-flex !important;
                    align-items: center !important;
                    justify-content: center !important;
                    transition: all 0.15s ease-in-out !important;
                    padding: 0 10px !important;
                }
                .je-letter-btn:hover {
                    color: #fff !important;
                    background: rgba(255, 255, 255, 0.08) !important;
                }
                .je-letter-btn.active {
                    background: #00a4dc !important;
                    color: #fff !important;
                    border-color: #00a4dc !important;
                }

                .je-rom-grid {
                    display: grid;
                    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                    gap: 16px;
                }
                .je-rom-card {
                    background: rgba(255, 255, 255, 0.02);
                    border: 1px solid rgba(255, 255, 255, 0.05);
                    border-radius: 10px;
                    padding: 14px;
                    display: flex;
                    gap: 14px;
                    align-items: center;
                    transition: all 0.2s ease-in-out;
                }
                .je-rom-card:hover {
                    background: rgba(255, 255, 255, 0.04);
                    border-color: rgba(255, 255, 255, 0.1);
                    transform: translateY(-2px);
                    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
                }
                .je-rom-thumb-container {
                    width: 70px;
                    height: 90px;
                    flex-shrink: 0;
                    border-radius: 6px;
                    background: rgba(0,0,0,0.3);
                    border: 1px solid rgba(255,255,255,0.06);
                    overflow: hidden;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                }
                .je-rom-thumb {
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                }
                .je-rom-info {
                    flex: 1;
                    display: flex;
                    flex-direction: column;
                    gap: 6px;
                    overflow: hidden;
                }
                .je-rom-title {
                    color: #fff;
                    font-weight: 600;
                    font-size: 0.95em;
                    margin: 0;
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                }
                .je-rom-badge-row {
                    display: flex;
                    gap: 6px;
                    flex-wrap: wrap;
                }
                .je-rom-badge {
                    font-size: 0.7em;
                    font-weight: 700;
                    padding: 2px 6px;
                    border-radius: 4px;
                    text-transform: uppercase;
                    letter-spacing: 0.03em;
                }
                .je-rom-badge.system {
                    background: rgba(0, 164, 220, 0.15);
                    color: #00a4dc;
                    border: 1px solid rgba(0, 164, 220, 0.3);
                }
                .je-rom-badge.provider {
                    background: rgba(255, 255, 255, 0.05);
                    color: #aaa;
                    border: 1px solid rgba(255, 255, 255, 0.08);
                }
                .je-rom-badge.region {
                    background: rgba(30, 144, 255, 0.15);
                    color: #1e90ff;
                    border: 1px solid rgba(30, 144, 255, 0.3);
                }
                .je-rom-badge.version {
                    background: rgba(147, 112, 219, 0.15);
                    color: #9370db;
                    border: 1px solid rgba(147, 112, 219, 0.3);
                }
                .je-rom-badge.manual {
                    background: rgba(46, 139, 87, 0.15);
                    color: #2e8b57;
                    border: 1px solid rgba(46, 139, 87, 0.3);
                }
                .je-rom-dl-btn {
                    align-self: flex-start;
                    background: rgba(0, 164, 220, 0.15) !important;
                    border: 1px solid rgba(0, 164, 220, 0.3) !important;
                    color: #00a4dc !important;
                    padding: 6px 12px !important;
                    border-radius: 6px !important;
                    font-size: 0.85em !important;
                    font-weight: 600 !important;
                    cursor: pointer !important;
                    transition: all 0.15s ease-in-out !important;
                    display: inline-flex !important;
                    align-items: center !important;
                    gap: 4px !important;
                    box-shadow: none !important;
                }
                .je-rom-dl-btn:hover {
                    background: #00a4dc !important;
                    color: #fff !important;
                }

            <!-- Dynamic Tab Content View Shell -->
            <div id="je-tab-container">

            </div>

        </div>
    </div>

    <script type="text/javascript" src="/jellyemu/config/js/community"></script>
    <script type="text/javascript" src="/jellyemu/config/js/configRouter"></script>
</div>
