<div id="JellyEmuConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
    <div data-role="content">
        <div class="content-primary" style="padding: 0; max-width: 100%;">
            <!-- React Mount Container -->
            <div id="jellyemu-config-root"></div>
        </div>
    </div>

    <script>
        (function () {
            var getUrl = function (path) {
                var cleanPath = (path || '').replace(/^\/+/, '');
                if (window.ApiClient && typeof window.ApiClient.getUrl === 'function' && cleanPath) {
                    try {
                        return window.ApiClient.getUrl(cleanPath);
                    } catch (e) {
                        console.warn('[JellyEmu] ApiClient.getUrl failed, using fallback:', e);
                    }
                }
                var base = '';
                if (window.location && window.location.pathname) {
                    var idx = window.location.pathname.indexOf('/web');
                    if (idx > 0) base = window.location.pathname.substring(0, idx);
                }
                return (base || '').replace(/\/+$/, '') + '/' + cleanPath;
            };

            // Inject Stylesheet if not already added
            var cssId = 'je-config-bundle-css';
            if (!document.getElementById(cssId)) {
                var link = document.createElement('link');
                link.id = cssId;
                link.rel = 'stylesheet';
                link.href = getUrl('jellyemu/assets/dist/jellyemu.index.bundle.css');
                document.head.appendChild(link);
            }

            // Load ES Module via dynamic import()
            var scriptUrl = getUrl('jellyemu/assets/dist/jellyemu.config.bundle.js');
            import(scriptUrl).then(function (mod) {
                if (mod && typeof mod.mountConfigApp === 'function') {
                    mod.mountConfigApp();
                } else if (window.JellyEmuConfig && typeof window.JellyEmuConfig.mount === 'function') {
                    window.JellyEmuConfig.mount();
                }
            }).catch(function (err) {
                console.error('[JellyEmu] Failed loading config module:', err);
            });
        })();
    </script>
</div>
