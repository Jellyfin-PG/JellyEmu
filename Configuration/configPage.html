<div id="JellyEmuConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
    <div data-role="content">
        <div class="content-primary" style="padding: 0; max-width: 100%;">
            <!-- React Mount Container -->
            <div id="jellyemu-config-root"></div>
        </div>
    </div>

    <script>
        (function () {
            var getUrl = function (path) {
                var cleanPath = (path || '').replace(/^\/+/, '');
                if (window.ApiClient && typeof window.ApiClient.getUrl === 'function' && cleanPath) {
                    try {
                        return window.ApiClient.getUrl(cleanPath);
                    } catch (e) {
                        console.warn('[JellyEmu] ApiClient.getUrl failed, using fallback:', e);
                    }
                }
                var base = '';
                if (window.location && window.location.pathname) {
                    var idx = window.location.pathname.indexOf('/web');
                    if (idx > 0) base = window.location.pathname.substring(0, idx);
                }
                return (base || '').replace(/\/+$/, '') + '/' + cleanPath;
            };

            var cacheBust = Date.now();

            // Inject Stylesheet if not already added
            var cssId = 'je-config-bundle-css';
            if (!document.getElementById(cssId)) {
                var link = document.createElement('link');
                link.id = cssId;
                link.rel = 'stylesheet';
                link.href = getUrl('jellyemu/assets/dist/jellyemu.index.bundle.css?v=' + cacheBust);
                document.head.appendChild(link);
            }

            // Lifecycle cleanup handlers
            var page = document.getElementById('JellyEmuConfigPage');
            var unmount = function () {
                if (window.JellyEmuConfig && typeof window.JellyEmuConfig.unmount === 'function') {
                    window.JellyEmuConfig.unmount();
                }
            };
            if (page) {
                page.addEventListener('viewhide', unmount);
                page.addEventListener('pagehide', unmount);
                page.addEventListener('viewdestroy', unmount);

                // MutationObserver fallback for React Router navigations
                // (viewhide/pagehide/viewdestroy don't fire during React Router transitions)
                if (page.parentNode) {
                    var parentObserver = new MutationObserver(function (mutations) {
                        for (var i = 0; i < mutations.length; i++) {
                            var removed = mutations[i].removedNodes;
                            for (var j = 0; j < removed.length; j++) {
                                if (removed[j] === page || (removed[j].contains && removed[j].contains(page))) {
                                    unmount();
                                    parentObserver.disconnect();
                                    return;
                                }
                            }
                        }
                    });
                    parentObserver.observe(page.parentNode, { childList: true });
                }
            }

            // Load ES Module via dynamic import()
            var scriptUrl = getUrl('jellyemu/assets/dist/jellyemu.config.bundle.js?v=' + cacheBust);
            import(scriptUrl).then(function (mod) {
                if (mod && typeof mod.mountConfigApp === 'function') {
                    mod.mountConfigApp();
                } else if (window.JellyEmuConfig && typeof window.JellyEmuConfig.mount === 'function') {
                    window.JellyEmuConfig.mount();
                }
            }).catch(function (err) {
                console.error('[JellyEmu] Failed loading config module:', err);
            });
        })();
    </script>
</div>
