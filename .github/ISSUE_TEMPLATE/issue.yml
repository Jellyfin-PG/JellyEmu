name: "Issue Report"
description: "Report a bug, request a feature, or ask a question"
title: "[Issue]: "
labels: []
body:

  - type: dropdown
    id: issue_type
    attributes:
      label: Issue Type
      description: What kind of issue is this?
      options:
        - Bug Report
        - Feature Request
        - Enhancement
        - Question / Support
    validations:
      required: true

  - type: input
    id: jellyfin_version
    attributes:
      label: Jellyfin Version
      description: e.g. 10.9.0
      placeholder: "10.9.0"
    validations:
      required: true

  - type: input
    id: jellyemu_version
    attributes:
      label: JellyEmu Version
      description: e.g. 1.4.2
      placeholder: "1.4.2"
    validations:
      required: true

  - type: input
    id: file_transform_version
    attributes:
      label: File Transformation Version
      description: e.g. 0.8.1
      placeholder: "0.8.1"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the issue or request clearly
      placeholder: "Explain what is happening..."
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce (Bug Reports Only)
      description: Provide steps if this is a bug
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe issue
    validations:
      required: false

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: false

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: false

  - type: textarea
    id: logs_screenshots
    attributes:
      label: Logs / Screenshots (Highly Recommended)
      description: Paste logs or attach screenshots here
      placeholder: "Drag & drop images or paste logs"
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Anything else we should know?
    validations:
      required: false
