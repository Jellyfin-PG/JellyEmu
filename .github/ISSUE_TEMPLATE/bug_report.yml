name: Bug Report
description: Report something that is broken or not working correctly
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ### Important Rules Before You Submit
        By opening this ticket, you agree to the following community standards:
        - Responsiveness: You must be able to respond to requests for further information or testing within 48 hours. Failure to do so will result in the ticket being closed.
        - Respect Ticket Boundaries: Do not hijack other tickets to discuss separate issues. Keep each issue focused on its original topic.
        - Professionalism: Maintain a respectful tone. Disrespectful, spammy, or repetitive false reports will lead to being blocked from the repository.
  - type: checkboxes
    id: acknowledgment
    attributes:
      label: Acknowledgment
      options:
        - label: I agree to the 48-hour response policy and agree to maintain professional boundaries in this ticket.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true
  - type: input
    id: jellyfin_version
    attributes:
      label: Jellyfin Version
      placeholder: "10.9.0"
    validations:
      required: true
  - type: input
    id: jellyemu_version
    attributes:
      label: JellyEmu Version
      placeholder: "1.4.2"
    validations:
      required: true
  - type: input
    id: file_transform_version
    attributes:
      label: File Transformation Version
      placeholder: "0.8.1"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Describe the issue clearly
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste logs or attach screenshots
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
    validations:
      required: false