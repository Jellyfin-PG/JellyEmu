name: CI & Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Restore dependencies
        run: dotnet restore

      - name: Check C# Code Style & Analyzers
        run: |
          dotnet format style JellyEmu.sln --verify-no-changes
          dotnet format analyzers JellyEmu.sln --verify-no-changes

      - name: Check for Vulnerable Dependencies
        run: dotnet list package --vulnerable --include-transitive

      - name: Run Unit Tests with Coverage
        run: dotnet test --configuration Release --no-restore --collect:"XPlat Code Coverage"

      - name: Validate JavaScript Syntax
        run: |
          for f in $(find Web Configuration -name "*.js"); do
            node -c "$f" || exit 1
          done
